name: Daily add at home flag

on:
  schedule:
    - cron: '0 10 * * *'   # täglich 10:00 UTC
  workflow_dispatch: {}     # manueller Testlauf via Actions-Tab möglich

jobs:
  add-at-home-flag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencies installieren
        run: pip install requests

      - name: "At home"-Flag eintragen
        env:
          TURSO_URL: ${{ secrets.TURSO_URL }}
          TURSO_TOKEN: ${{ secrets.TURSO_TOKEN }}
        run: python scripts/add_at_home_flag.py
