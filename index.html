<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seestrasse 52B · Übersicht</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">Seestrasse <span>52B</span></div>
  <nav class="tabs">
    <a href="index.html" class="active">Übersicht</a>
    <a href="log.html">Log</a>
    <a href="eve-data.html">Eve-Data</a>
    <a href="uploader.html">Uploader</a>
    <a href="admin.html">Admin</a>
  </nav>
</header>
<main>
  <h1>Parameter-Übersicht</h1>
  <div id="msg" class="msg" style="display:none;"></div>
  <div id="grid"></div>
  <div id="empty" class="empty" style="display:none;">Noch keine aktiven Parameter definiert. <a href="admin.html">Parameter anlegen →</a></div>
  <button id="refreshBtn" class="secondary" style="margin-top:14px;">Aktualisieren</button>
</main>
<script src="assets/turso.js"></script>
<script>
const msg = document.getElementById('msg');
const grid = document.getElementById('grid');

async function load(forceRefresh){
  try{
    const client = getClient();
    if(forceRefresh){
      cacheInvalidate('param:');
      cacheInvalidate('index:');
      cacheInvalidate('eve:');
    }

    // 'Eve Räume' und 'ValueType' sind interne Eve-Dimensionsparameter (Raumname / Messgrösse),
    // keine direkt loggbaren Werte — die werden weiter unten als eigene Eve-Karten pro Raum gerendert.
    const paramsResult = await client.execute(
      "SELECT ParameterID, ParaGroup, Name, Einheit FROM seestrasse_parameter WHERE Active = 1 AND ParaGroup NOT IN ('Eve Räume','ValueType') ORDER BY ParaGroup, Name"
    );
    const params = TursoClient.rowsToObjects(paramsResult);

    const latestRows = await queryCached(client, 'index:latest', `
      SELECT l.ParameterID, l.Value, l.Datum
      FROM seestrasse_log l
      INNER JOIN (
        SELECT ParameterID, MAX(Datum) AS MaxDatum
        FROM seestrasse_log GROUP BY ParameterID
      ) m ON m.ParameterID = l.ParameterID AND m.MaxDatum = l.Datum
    `);
    const latestByParam = {};
    latestRows.forEach(r => { latestByParam[r.ParameterID] = r; });

    const groups = {};
    params.forEach(p => {
      const g = p.ParaGroup || 'Ohne Gruppe';
      if(!groups[g]) groups[g] = [];
      groups[g].push(p);
    });

    let html = Object.keys(groups).sort().map(groupName => {
      const cards = groups[groupName].map(p => {
        const latest = latestByParam[p.ParameterID];
        const valueHtml = latest
          ? `<div class="pvalue">${escapeHtml(latest.Value)} <span class="punit">${escapeHtml(p.Einheit||'')}</span></div>
             <div class="pdate">${fmtDateTime(latest.Datum)}</div>`
          : `<div class="pvalue mono" style="color:var(--grey-600);font-size:15px;">– keine Daten –</div>`;
        return `<a class="param-card" href="parameter.html?id=${p.ParameterID}">
                  <div class="pname">${escapeHtml(p.Name)}</div>
                  ${valueHtml}
                </a>`;
      }).join('');
      return `<h2 style="margin-top:22px;">${escapeHtml(groupName)}</h2><div class="grid">${cards}</div>`;
    }).join('');

    const eveHtml = await buildEveSection(client);
    html += eveHtml;

    grid.innerHTML = html;
    document.getElementById('empty').style.display = (params.length === 0 && !eveHtml) ? 'block' : 'none';
  }catch(e){
    showMsg(msg, 'Fehler beim Laden: ' + e.message, 'err');
  }
}

// Baut pro Eve-Raum eine Karte mit aktuellem Temperatur- und Luftfeuchtigkeitswert
// (statt einzelner generischer "C"/"RelLuft"-Kacheln).
// Bewusst UNCACHED: diese Liste ändert sich bei jedem Eve-Upload und soll auf der
// Übersichtsseite immer den aktuellen Stand zeigen, nicht bis zu 60 Min. alten Cache.
async function buildEveSection(client){
  const latestEveResult = await client.execute(`
    SELECT e.SensorParameterID, e.ValueTypeParameterID, e.Value, e.Datum
    FROM seestrasse_eve_data e
    INNER JOIN (
      SELECT SensorParameterID, ValueTypeParameterID, MAX(Datum) AS MaxDatum
      FROM seestrasse_eve_data GROUP BY SensorParameterID, ValueTypeParameterID
    ) m ON m.SensorParameterID = e.SensorParameterID AND m.ValueTypeParameterID = e.ValueTypeParameterID AND m.MaxDatum = e.Datum
  `);
  const latestEve = TursoClient.rowsToObjects(latestEveResult);
  if(latestEve.length === 0) return '';

  // Raum-Karten werden aus den tatsächlich in seestrasse_eve_data vorkommenden
  // SensorParameterID-Werten gebaut (nicht aus seestrasse_parameter WHERE ParaGroup=...),
  // damit die angezeigte ID immer exakt der SensorParameterID der Messdaten entspricht.
  const sensorIds = [...new Set(latestEve.map(r => Number(r.SensorParameterID)))];
  let sensorNameById = {};
  if(sensorIds.length){
    const sPlaceholders = sensorIds.map(() => '?').join(',');
    const sensorNamesResult = await client.execute(
      `SELECT ParameterID, Name FROM seestrasse_parameter WHERE ParameterID IN (${sPlaceholders})`,
      sensorIds
    );
    TursoClient.rowsToObjects(sensorNamesResult).forEach(p => { sensorNameById[Number(p.ParameterID)] = p.Name; });
  }
  const sensors = sensorIds.map(id => ({ ParameterID: id, Name: sensorNameById[id] || `Parameter ${id}` }))
    .sort((a,b) => a.Name.localeCompare(b.Name));

  // ValueType-Parameter (Temperatur/Luftfeuchtigkeit) werden datengetrieben ermittelt
  // (über die tatsächlich in seestrasse_eve_data vorkommenden IDs), statt eine feste
  // ParaGroup-Bezeichnung wie 'ValueType' anzunehmen — deren genauer Name war zuvor
  // nicht zuverlässig und liess die Werte auf Übersicht/Charts verschwinden.
  const vtIds = [...new Set(latestEve.map(r => Number(r.ValueTypeParameterID)))];
  let vtById = {};
  if(vtIds.length){
    const placeholders = vtIds.map(() => '?').join(',');
    const vtParamsResult = await client.execute(
      `SELECT ParameterID, Name, Einheit FROM seestrasse_parameter WHERE ParameterID IN (${placeholders})`,
      vtIds
    );
    TursoClient.rowsToObjects(vtParamsResult).forEach(vt => { vtById[Number(vt.ParameterID)] = vt; });
  }
  const bySensor = {};
  latestEve.forEach(r => {
    if(!bySensor[r.SensorParameterID]) bySensor[r.SensorParameterID] = {};
    bySensor[r.SensorParameterID][r.ValueTypeParameterID] = r;
  });

  const cards = sensors.map(s => {
    const readings = bySensor[s.ParameterID] || {};
    const parts = vtIds.map(vtId => {
      const r = readings[vtId];
      if(!r) return null;
      const vt = vtById[vtId] || {};
      const rounded = Math.round(Number(r.Value) * 10) / 10;
      return `${rounded.toFixed(1)} ${escapeHtml(vt.Einheit||'')}`.trim();
    }).filter(Boolean);
    if(parts.length === 0) return ''; // Raum ohne jegliche Werte: Kachel weglassen
    const anyReading = Object.values(readings)[0];
    const dateHtml = anyReading ? `<div class="pdate">${fmtDate(anyReading.Datum)}</div>` : '';
    return `<div class="param-card">
              <div class="pname">${escapeHtml(s.Name)}</div>
              <div class="pvalue" style="font-size:17px;">${parts.join(' / ')}</div>
              ${dateHtml}
            </div>`;
  }).filter(Boolean).join('');

  if(!cards) return '';
  return `<h2 style="margin-top:22px;">Eve</h2><div class="grid">${cards}</div>`;
}
document.getElementById('refreshBtn').addEventListener('click', () => load(true));
load();
</script>
</body>
</html>
